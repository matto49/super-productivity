<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Super Productivity Task Widget</title>
    <link
      rel="stylesheet"
      href="task-widget.css"
    />
  </head>
  <body>
    <section
      id="task-list-widget"
      hidden
    >
      <header id="list-header">
        <strong id="list-title"></strong><span id="list-count"></span
        ><button
          id="list-add"
          type="button"
        >
          ＋</button
        ><button id="list-open">↗</button>
      </header>
      <form
        id="list-add-form"
        hidden
      >
        <input
          id="list-add-input"
          maxlength="1000"
          autocomplete="off"
        /><button type="submit">↵</button>
      </form>
      <div
        id="task-list"
        role="list"
      ></div>
      <p
        id="list-empty"
        hidden
      ></p>
    </section>
    <div id="task-widget-container">
      <div id="content">
        <div id="task-title">No active task</div>
        <div id="time-display">--:--</div>
      </div>
      <button
        id="show-main"
        title="Show main window"
      >
        ▲
      </button>
    </div>
    <script src="task-widget-renderer.js"></script>
  </body>
</html>
